plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

android {
    namespace "com.example.storage_optimizer_new"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.storage_optimizer_new"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters.clear()
            abiFilters.add("arm64-v8a")
            abiFilters.add("x86_64")
        }

        python {
            buildPython "C:/Users/kayom/AppData/Local/Programs/Python/Python313/python.exe"
            version "3.13"
            pip {
                install "numpy==1.26.2"
            }
        }
    }

    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // Runs the new-media watcher when the app is closed, which is the only way
    // the storage alerts can be proactive rather than after-the-fact.
    implementation "androidx.work:work-runtime-ktx:2.9.1"
}