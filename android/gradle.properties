# Gradle 8.14 cannot run on JDK 25 (its embedded Kotlin compiler fails to parse
# the version string). Pin the daemon to the JDK 21 LTS toolchain.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.builtInKotlin=true
android.newDsl=true

# This project lives on D: while the pub cache lives on C:. Kotlin's relocatable
# incremental caches cannot relativize plugin sources across drive roots, which
# crashes the Kotlin daemon and forces a slow non-incremental retry on every
# plugin module. Disable incremental compilation instead.
kotlin.incremental=false